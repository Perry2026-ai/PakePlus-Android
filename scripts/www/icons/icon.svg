<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ed08f"/>
      <stop offset="100%" stop-color="#4f9e57"/>
    </linearGradient>
    <radialGradient id="center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e8a93c"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(256,256)">
    <!-- 花瓣 -->
    <g fill="#ffd84d">
      <ellipse cx="0" cy="-150" rx="42" ry="78" transform="rotate(0)"/>
      <ellipse cx="0" cy="-150" rx="42" ry="78" transform="rotate(45)"/>
      <ellipse cx="0" cy="-150" rx="42" ry="78" transform="rotate(90)"/>
      <ellipse cx="0" cy="-150" rx="42" ry="78" transform="rotate(135)"/>
      <ellipse cx="0" cy="-150" rx="42" ry="78" transform="rotate(180)"/>
      <ellipse cx="0" cy="-150" rx="42" ry="78" transform="rotate(225)"/>
      <ellipse cx="0" cy="-150" rx="42" ry="78" transform="rotate(270)"/>
      <ellipse cx="0" cy="-150" rx="42" ry="78" transform="rotate(315)"/>
    </g>
    <g fill="#f5c765" opacity="0.5">
      <ellipse cx="0" cy="-150" rx="42" ry="78" transform="rotate(22.5)"/>
      <ellipse cx="0" cy="-150" rx="42" ry="78" transform="rotate(67.5)"/>
      <ellipse cx="0" cy="-150" rx="42" ry="78" transform="rotate(112.5)"/>
      <ellipse cx="0" cy="-150" rx="42" ry="78" transform="rotate(157.5)"/>
      <ellipse cx="0" cy="-150" rx="42" ry="78" transform="rotate(202.5)"/>
      <ellipse cx="0" cy="-150" rx="42" ry="78" transform="rotate(247.5)"/>
      <ellipse cx="0" cy="-150" rx="42" ry="78" transform="rotate(292.5)"/>
      <ellipse cx="0" cy="-150" rx="42" ry="78" transform="rotate(337.5)"/>
    </g>
    <!-- 花心 -->
    <circle cx="0" cy="0" r="78" fill="url(#center)"/>
    <circle cx="0" cy="0" r="78" fill="none" stroke="#c97a14" stroke-width="3"/>
    <!-- 花心纹理 -->
    <g fill="#8a5a1a">
      <circle cx="-22" cy="-22" r="6"/>
      <circle cx="22" cy="-22" r="6"/>
      <circle cx="0" cy="0" r="6"/>
      <circle cx="-22" cy="22" r="6"/>
      <circle cx="22" cy="22" r="6"/>
      <circle cx="-40" cy="0" r="5"/>
      <circle cx="40" cy="0" r="5"/>
      <circle cx="0" cy="-40" r="5"/>
      <circle cx="0" cy="40" r="5"/>
    </g>
  </g>
</svg>
